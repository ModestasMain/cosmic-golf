name = "cosmic-golf-mp"
main = "src/index.js"
compatibility_date = "2025-01-01"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "CosmicGolfRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["CosmicGolfRoom"]

[[kv_namespaces]]
binding = "GLOBAL_LB"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_ID"
